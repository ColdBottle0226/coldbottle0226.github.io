<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#F9FAFB" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">create_agent(model, tools, middleware=[...])</text>

  <!-- User input -->
  <rect x="270" y="52" width="180" height="44" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">사용자 입력</text>
  <line x1="360" y1="98" x2="360" y2="116" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PIIMiddleware -->
  <rect x="200" y="120" width="320" height="56" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="360" y="144" text-anchor="middle" font-size="13" font-weight="600" fill="#BE123C">PIIMiddleware</text>
  <text x="360" y="164" text-anchor="middle" font-size="11" fill="#E11D48">개인정보 감지 마스킹/차단 (apply_to_input=True)</text>
  <line x1="360" y1="178" x2="360" y2="196" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- TodoListMiddleware -->
  <rect x="200" y="200" width="320" height="56" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="360" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#0F766E">TodoListMiddleware</text>
  <text x="360" y="244" text-anchor="middle" font-size="11" fill="#0D9488">복잡한 요청을 단계별로 분해 실행</text>
  <line x1="360" y1="258" x2="360" y2="276" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Agent Core -->
  <rect x="160" y="280" width="400" height="64" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="360" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#5B21B6">Agent Core (LLM + Tools)</text>
  <text x="360" y="326" text-anchor="middle" font-size="11" fill="#7C3AED">추론 후 tool_calls 계획 후 ToolMessage 실행 후 최종 답변</text>
  <line x1="360" y1="346" x2="360" y2="364" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HITL -->
  <rect x="200" y="368" width="320" height="56" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="360" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">HumanInTheLoopMiddleware</text>
  <text x="360" y="412" text-anchor="middle" font-size="11" fill="#B45309">민감 도구 실행 전 사람 승인 요청 (checkpointer 필수)</text>
  <line x1="360" y1="426" x2="360" y2="444" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="270" y="448" width="180" height="44" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="360" y="474" text-anchor="middle" font-size="13" font-weight="600" fill="#15803D">최종 응답 출력</text>

  <!-- Emulator note -->
  <rect x="30" y="280" width="118" height="64" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="89" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">LLMTool</text>
  <text x="89" y="318" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Emulator</text>
  <text x="89" y="334" text-anchor="middle" font-size="10" fill="#6B7280">실제 API 없이</text>
  <text x="89" y="348" text-anchor="middle" font-size="10" fill="#6B7280">가짜 데이터 생성</text>
  <line x1="148" y1="312" x2="160" y2="312" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 2"/>
</svg>
