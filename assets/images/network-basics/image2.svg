<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <style>
      .sans { font-family: 'Noto Sans KR','Malgun Gothic',sans-serif; }
      .mono { font-family: 'JetBrains Mono','Courier New',monospace; }
    </style>
  </defs>
  <rect width="860" height="400" rx="12" fill="#0F172A"/>
  <text x="430" y="34" text-anchor="middle" fill="#F1F5F9" font-size="15" font-weight="bold" class="sans">네트워크 주소 계산 : IP AND 서브넷마스크 비트 연산</text>
  <line x1="40" y1="46" x2="820" y2="46" stroke="#334155" stroke-width="1"/>

  <!-- 헤더 -->
  <text x="175" y="67" text-anchor="middle" fill="#94A3B8" font-size="11" class="sans">10진수</text>
  <text x="530" y="67" text-anchor="middle" fill="#94A3B8" font-size="11" class="sans">2진수 (비트)</text>

  <!-- Row 1: IP 주소 -->
  <rect x="40" y="74" width="780" height="72" rx="8" fill="#1E293B"/>
  <rect x="40" y="74" width="780" height="72" rx="8" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="54" y="96" fill="#94A3B8" font-size="11" class="sans">IP 주소</text>
  <text x="175" y="100" text-anchor="middle" fill="#3B82F6" font-size="20" font-weight="bold" class="mono">192.168.1.100</text>
  <text x="530" y="96" text-anchor="middle" fill="#60A5FA" font-size="12" class="mono">11000000</text>
  <text x="622" y="96" text-anchor="middle" fill="#60A5FA" font-size="12" class="mono">10101000</text>
  <text x="714" y="96" text-anchor="middle" fill="#60A5FA" font-size="12" class="mono">00000001</text>
  <text x="806" y="96" text-anchor="middle" fill="#60A5FA" font-size="12" class="mono">01100100</text>
  <text x="530" y="132" text-anchor="middle" fill="#475569" font-size="9" class="sans">1번째 옥텟</text>
  <text x="622" y="132" text-anchor="middle" fill="#475569" font-size="9" class="sans">2번째 옥텟</text>
  <text x="714" y="132" text-anchor="middle" fill="#475569" font-size="9" class="sans">3번째 옥텟</text>
  <text x="806" y="132" text-anchor="middle" fill="#EF4444" font-size="9" font-weight="bold" class="sans">4번째 옥텟</text>

  <!-- AND 기호 -->
  <text x="410" y="170" text-anchor="middle" fill="#F59E0B" font-size="18" font-weight="bold" class="sans">AND 연산: 1 AND 1 = 1  /  1 AND 0 = 0  /  0 AND 0 = 0</text>
  <line x1="40" y1="178" x2="820" y2="178" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Row 2: 서브넷마스크 -->
  <rect x="40" y="182" width="780" height="72" rx="8" fill="#1E293B"/>
  <rect x="40" y="182" width="780" height="72" rx="8" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="54" y="204" fill="#94A3B8" font-size="11" class="sans">서브넷</text>
  <text x="54" y="220" fill="#94A3B8" font-size="11" class="sans">마스크</text>
  <text x="175" y="218" text-anchor="middle" fill="#06B6D4" font-size="20" font-weight="bold" class="mono">255.255.255.0</text>
  <text x="530" y="204" text-anchor="middle" fill="#67E8F9" font-size="12" class="mono">11111111</text>
  <text x="622" y="204" text-anchor="middle" fill="#67E8F9" font-size="12" class="mono">11111111</text>
  <text x="714" y="204" text-anchor="middle" fill="#67E8F9" font-size="12" class="mono">11111111</text>
  <text x="806" y="204" text-anchor="middle" fill="#EF4444" font-size="12" class="mono">00000000</text>
  <text x="530" y="238" text-anchor="middle" fill="#475569" font-size="9" class="sans">모두 1 → 그대로</text>
  <text x="622" y="238" text-anchor="middle" fill="#475569" font-size="9" class="sans">모두 1 → 그대로</text>
  <text x="714" y="238" text-anchor="middle" fill="#475569" font-size="9" class="sans">모두 1 → 그대로</text>
  <text x="806" y="238" text-anchor="middle" fill="#EF4444" font-size="9" class="sans">모두 0 → 전부 0</text>

  <!-- 결과선 -->
  <line x1="490" y1="262" x2="820" y2="262" stroke="#10B981" stroke-width="1.5"/>

  <!-- Row 3: 결과 -->
  <rect x="40" y="266" width="780" height="72" rx="8" fill="#10B98115"/>
  <rect x="40" y="266" width="780" height="72" rx="8" fill="none" stroke="#10B981" stroke-width="2"/>
  <text x="54" y="286" fill="#10B981" font-size="11" font-weight="bold" class="sans">AND 결과</text>
  <text x="54" y="302" fill="#10B981" font-size="10" class="sans">(네트워크</text>
  <text x="54" y="318" fill="#10B981" font-size="10" class="sans">주소)</text>
  <text x="175" y="306" text-anchor="middle" fill="#10B981" font-size="22" font-weight="bold" class="mono">192.168.1.0</text>
  <text x="530" y="290" text-anchor="middle" fill="#6EE7B7" font-size="12" class="mono">11000000</text>
  <text x="622" y="290" text-anchor="middle" fill="#6EE7B7" font-size="12" class="mono">10101000</text>
  <text x="714" y="290" text-anchor="middle" fill="#6EE7B7" font-size="12" class="mono">00000001</text>
  <text x="806" y="290" text-anchor="middle" fill="#6EE7B7" font-size="12" class="mono">00000000</text>
  <text x="530" y="326" text-anchor="middle" fill="#94A3B8" font-size="9" class="sans">그대로 유지</text>
  <text x="622" y="326" text-anchor="middle" fill="#94A3B8" font-size="9" class="sans">그대로 유지</text>
  <text x="714" y="326" text-anchor="middle" fill="#94A3B8" font-size="9" class="sans">그대로 유지</text>
  <text x="806" y="326" text-anchor="middle" fill="#EF4444" font-size="9" class="sans">→ 0으로 변환</text>

  <text x="430" y="368" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="bold" class="sans">→  네트워크 주소 = 192.168.1.0</text>
  <text x="430" y="386" text-anchor="middle" fill="#475569" font-size="10" class="sans">마스크가 1인 자리는 IP 그대로, 0인 자리는 전부 0으로 변환</text>
</svg>
