<svg width="700" height="390" viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="390" fill="#F8FAFC" rx="16"/>

  <!-- Title bar -->
  <rect width="700" height="52" fill="#1E293B" rx="16"/>
  <rect y="36" width="700" height="16" fill="#1E293B"/>
  <text x="350" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Intent 스킴 — 동작 흐름 (Android 전용)</text>

  <!-- Step 1: User clicks -->
  <rect x="185" y="72" width="330" height="62" rx="10" fill="#2563EB" filter="url(#shadow)"/>
  <text x="350" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="white">사용자가 intent://open#Intent;... 클릭</text>
  <text x="350" y="117" text-anchor="middle" font-size="12" fill="#BFDBFE">Chrome 브라우저에서 직접 액션 필요</text>

  <!-- Arrow 1 -->
  <line x1="350" y1="134" x2="350" y2="162" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Chrome parse -->
  <rect x="185" y="162" width="330" height="62" rx="10" fill="#0F766E" filter="url(#shadow)"/>
  <text x="350" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Chrome이 Intent URL 파싱</text>
  <text x="350" y="202" text-anchor="middle" font-size="12" fill="#99F6E4">scheme · package · fallback_url 추출</text>
  <!-- Chrome badge -->
  <rect x="574" y="166" width="54" height="20" rx="4" fill="#1D4ED8"/>
  <text x="601" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Chrome</text>

  <!-- Fork connector -->
  <line x1="350" y1="224" x2="350" y2="252" stroke="#94A3B8" stroke-width="2"/>
  <line x1="120" y1="252" x2="580" y2="252" stroke="#94A3B8" stroke-width="2"/>
  <line x1="120" y1="252" x2="120" y2="278" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="252" x2="580" y2="278" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Branch labels -->
  <rect x="168" y="240" width="105" height="20" rx="4" fill="#E2E8F0"/>
  <text x="221" y="254" text-anchor="middle" font-size="11" fill="#475569">package 앱 설치됨</text>
  <rect x="427" y="240" width="105" height="20" rx="4" fill="#E2E8F0"/>
  <text x="480" y="254" text-anchor="middle" font-size="11" fill="#475569">앱 미설치</text>

  <!-- Left: App runs -->
  <rect x="30" y="278" width="180" height="80" rx="10" fill="#059669" filter="url(#shadow)"/>
  <text x="120" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="white">앱 실행</text>
  <text x="120" y="324" text-anchor="middle" font-size="12" fill="#D1FAE5">scheme 딥링크로</text>
  <text x="120" y="343" text-anchor="middle" font-size="12" fill="#D1FAE5">앱 실행 및 이동</text>

  <!-- Right: Fallback -->
  <rect x="490" y="278" width="180" height="80" rx="10" fill="#D97706" filter="url(#shadow)"/>
  <text x="580" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="white">S.browser_fallback_url</text>
  <text x="580" y="321" text-anchor="middle" font-size="12" fill="#FEF3C7">지정된 URL로</text>
  <text x="580" y="340" text-anchor="middle" font-size="12" fill="#FEF3C7">브라우저 자동 이동</text>
</svg>
