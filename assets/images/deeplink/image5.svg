<svg width="700" height="560" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="560" fill="#F8FAFC" rx="16"/>

  <!-- Title bar -->
  <rect width="700" height="52" fill="#1E293B" rx="16"/>
  <rect y="36" width="700" height="16" fill="#1E293B"/>
  <text x="350" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="white">딥링크 방식 선택 가이드</text>

  <!-- Root question -->
  <rect x="220" y="68" width="260" height="50" rx="10" fill="#334155" filter="url(#shadow)"/>
  <text x="350" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="white">지원할 플랫폼은?</text>
  <text x="350" y="108" text-anchor="middle" font-size="11" fill="#CBD5E1">또는 구현 방식 우선순위는?</text>

  <!-- 4 vertical lines from root to branch labels -->
  <line x1="350" y1="118" x2="350" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="90" y1="138" x2="610" y2="138" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="90" y1="138" x2="90" y2="165" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="252" y1="138" x2="252" y2="165" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="138" x2="480" y2="165" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="138" x2="610" y2="165" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Branch label badges -->
  <rect x="30" y="138" width="120" height="20" rx="10" fill="#E2E8F0"/>
  <text x="90" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">iOS 전용</text>

  <rect x="180" y="138" width="144" height="20" rx="10" fill="#E2E8F0"/>
  <text x="252" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Android 전용</text>

  <rect x="400" y="138" width="160" height="20" rx="10" fill="#E2E8F0"/>
  <text x="480" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">iOS + Android 모두</text>

  <rect x="552" y="138" width="116" height="20" rx="10" fill="#E2E8F0"/>
  <text x="610" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">빠른 구현</text>

  <!-- Branch 1: iOS only → Universal Link -->
  <rect x="22" y="165" width="136" height="90" rx="10" fill="#0EA5E9" filter="url(#shadow)"/>
  <text x="90" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Universal Link</text>
  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#E0F2FE">iOS 9+, HTTPS 기반</text>
  <text x="90" y="228" text-anchor="middle" font-size="11" fill="#E0F2FE">도메인 인증 필요</text>
  <text x="90" y="246" text-anchor="middle" font-size="11" fill="#BAE6FD">+ URI 스킴 보조</text>

  <!-- Branch 2: Android only → sub-decision -->
  <rect x="178" y="165" width="148" height="48" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="252" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="white">HTTPS 도메인</text>
  <text x="252" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="white">보유 여부?</text>

  <!-- sub-branch lines from Android question -->
  <line x1="252" y1="213" x2="252" y2="232" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="195" y1="232" x2="310" y2="232" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="195" y1="232" x2="195" y2="258" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="310" y1="232" x2="310" y2="258" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="160" y="248" text-anchor="middle" font-size="10" fill="#64748B">있음</text>
  <text x="342" y="248" text-anchor="middle" font-size="10" fill="#64748B">없음</text>

  <!-- Android Yes → App Link -->
  <rect x="136" y="258" width="120" height="88" rx="10" fill="#16A34A" filter="url(#shadow)"/>
  <text x="196" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="white">App Link</text>
  <text x="196" y="302" text-anchor="middle" font-size="11" fill="#D1FAE5">Android 6.0+</text>
  <text x="196" y="320" text-anchor="middle" font-size="11" fill="#D1FAE5">도메인 인증 필요</text>
  <text x="196" y="338" text-anchor="middle" font-size="11" fill="#BBF7D0">+ Intent 스킴 보조</text>

  <!-- Android No → URI + Intent -->
  <rect x="264" y="258" width="120" height="88" rx="10" fill="#6366F1" filter="url(#shadow)"/>
  <text x="324" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="white">URI 스킴</text>
  <text x="324" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="white">+ Intent 스킴</text>
  <text x="324" y="319" text-anchor="middle" font-size="11" fill="#C7D2FE">Chrome 환경에서</text>
  <text x="324" y="337" text-anchor="middle" font-size="11" fill="#C7D2FE">Fallback 내장 가능</text>

  <!-- Branch 3: iOS + Android -->
  <rect x="400" y="165" width="160" height="90" rx="10" fill="#7C3AED" filter="url(#shadow)"/>
  <text x="480" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Universal Link</text>
  <text x="480" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="white">+ App Link</text>
  <text x="480" y="226" text-anchor="middle" font-size="11" fill="#DDD6FE">플랫폼별 최적 방식</text>
  <text x="480" y="244" text-anchor="middle" font-size="11" fill="#C4B5FD">+ URI 스킴 (인앱 보조)</text>

  <!-- Branch 4: 빠른 구현 -->
  <rect x="548" y="165" width="124" height="90" rx="10" fill="#D97706" filter="url(#shadow)"/>
  <text x="610" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="white">URI 스킴</text>
  <text x="610" y="208" text-anchor="middle" font-size="11" fill="#FEF3C7">설정 최소화</text>
  <text x="610" y="226" text-anchor="middle" font-size="11" fill="#FEF3C7">iOS · Android 모두</text>
  <text x="610" y="244" text-anchor="middle" font-size="11" fill="#FDE68A">Fallback 직접 구현</text>

  <!-- Note section -->
  <rect x="18" y="376" width="664" height="164" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="18" y="376" width="664" height="36" rx="12" fill="#F1F5F9"/>
  <rect x="18" y="394" width="664" height="20" fill="#F1F5F9"/>
  <text x="350" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">실무 포인트</text>

  <text x="40" y="432" font-size="12" fill="#475569">▪</text>
  <text x="56" y="432" font-size="12" fill="#475569">Universal Link · App Link는 HTTPS 도메인과 서버 파일(AASA / assetlinks.json) 설정이 필수다.</text>

  <text x="40" y="456" font-size="12" fill="#475569">▪</text>
  <text x="56" y="456" font-size="12" fill="#475569">카카오톡 · Instagram 인앱 브라우저는 Universal Link / App Link가 제대로 동작하지 않을 수 있다.</text>

  <text x="40" y="480" font-size="12" fill="#475569">▪</text>
  <text x="56" y="480" font-size="12" fill="#475569">두 방식을 병행하는 것이 현실적이다: 공식 브라우저는 UL/AL, 인앱 환경은 URI 스킴으로 커버.</text>

  <text x="40" y="504" font-size="12" fill="#475569">▪</text>
  <text x="56" y="504" font-size="12" fill="#475569">Play 앱 서명 사용 시, Play Console에서 제공하는 SHA-256 지문을 assetlinks.json에 써야 한다.</text>
</svg>
