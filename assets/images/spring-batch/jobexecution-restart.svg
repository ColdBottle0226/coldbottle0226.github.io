<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 205" width="720" height="205">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; }
      .sm  { font-size: 10px; }
    </style>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="205" rx="12" fill="#fafafa"/>

  <!-- JobInstance container -->
  <rect x="18" y="18" width="680" height="168" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.2"/>
  <text x="38" y="40" dominant-baseline="central" class="lbl" fill="#0C447C">JobInstance (01-01-2017) — EndOfDay Job</text>

  <!-- JobExecution #1 FAILED -->
  <rect x="36" y="58" width="210" height="112" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="1.2"/>
  <text x="141" y="82" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#501313">JobExecution #1</text>
  <text x="141" y="100" text-anchor="middle" dominant-baseline="central" class="sub" fill="#A32D2D">status: FAILED</text>
  <text x="141" y="118" text-anchor="middle" dominant-baseline="central" class="sm" fill="#791F1F">2017-01-01 21:00 ~ 21:30</text>
  <text x="141" y="134" text-anchor="middle" dominant-baseline="central" class="sm" fill="#791F1F">ExecutionContext 저장됨 ✓</text>
  <text x="141" y="152" text-anchor="middle" dominant-baseline="central" class="sm" fill="#791F1F">— 실패로 종료 —</text>

  <!-- Arrow FAILED → COMPLETED -->
  <line x1="246" y1="114" x2="298" y2="114" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrr)"/>
  <text x="272" y="104" text-anchor="middle" class="sm" fill="#A32D2D">재시작</text>

  <!-- JobExecution #2 COMPLETED -->
  <rect x="298" y="58" width="210" height="112" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="1.2"/>
  <text x="403" y="82" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#173404">JobExecution #2</text>
  <text x="403" y="100" text-anchor="middle" dominant-baseline="central" class="sub" fill="#3B6D11">status: COMPLETED</text>
  <text x="403" y="118" text-anchor="middle" dominant-baseline="central" class="sm" fill="#27500A">2017-01-02 21:00 ~ 21:30</text>
  <text x="403" y="134" text-anchor="middle" dominant-baseline="central" class="sm" fill="#27500A">중단 지점부터 재개 ✓</text>
  <text x="403" y="152" text-anchor="middle" dominant-baseline="central" class="sm" fill="#27500A">— 성공으로 완료 —</text>

  <!-- Note -->
  <text x="530" y="95" dominant-baseline="central" class="sub" fill="#0C447C">← 같은 JobInstance,</text>
  <text x="530" y="114" dominant-baseline="central" class="sub" fill="#0C447C">    다른 JobExecution</text>
  <text x="530" y="142" dominant-baseline="central" class="sm" fill="#185FA5">#2 성공 시 → JobInstance "완료"</text>
</svg>
