<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- JobInstance label -->
  <rect x="20" y="20" width="640" height="160" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="40" y="42" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">JobInstance (01-01-2017) — EndOfDay Job</text>

  <!-- JobExecution 1 FAILED -->
  <rect x="50" y="60" width="180" height="100" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="1"/>
  <text x="140" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#501313">JobExecution #1</text>
  <text x="140" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">status: FAILED</text>
  <text x="140" y="120" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">startTime: 2017-01-01 21:00</text>
  <text x="140" y="136" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">endTime:   2017-01-01 21:30</text>
  <text x="140" y="152" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">ExecutionContext 저장됨 ✓</text>

  <!-- arrow FAILED to retry -->
  <line x1="230" y1="110" x2="280" y2="110" stroke="#A32D2D" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
  <text x="255" y="100" text-anchor="middle" font-size="11" fill="#A32D2D">재시작</text>

  <!-- JobExecution 2 COMPLETED -->
  <rect x="280" y="60" width="180" height="100" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
  <text x="370" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">JobExecution #2</text>
  <text x="370" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">status: COMPLETED</text>
  <text x="370" y="120" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">startTime: 2017-01-02 21:00</text>
  <text x="370" y="136" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">endTime:   2017-01-02 21:30</text>
  <text x="370" y="152" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">중단 지점부터 재개 ✓</text>

  <!-- note -->
  <text x="480" y="100" dominant-baseline="central" font-size="12" fill="#0C447C">← 같은 JobInstance,</text>
  <text x="480" y="118" dominant-baseline="central" font-size="12" fill="#0C447C">  다른 JobExecution</text>
  <text x="480" y="144" dominant-baseline="central" font-size="11" fill="#185FA5">#2가 성공해야</text>
  <text x="480" y="160" dominant-baseline="central" font-size="11" fill="#185FA5">JobInstance "완료"</text>
</svg>
