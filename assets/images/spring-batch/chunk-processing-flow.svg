<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; }
      .sm  { font-size: 10px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="390" rx="12" fill="#fafafa"/>

  <!-- Transaction boundary dashed box -->
  <rect x="22" y="50" width="756" height="232" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="400" y="40" text-anchor="middle" dominant-baseline="central" class="sm" fill="#888">트랜잭션 경계 (chunk-size마다 반복)</text>
  <text x="42" y="68" dominant-baseline="central" class="sm" fill="#888">▶ chunk loop</text>

  <!-- Step -->
  <rect x="36" y="88" width="96" height="44" rx="6" fill="#F0EFFD" stroke="#AFA9EC" stroke-width="1"/>
  <text x="84" y="106" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#3C3489">Step</text>
  <text x="84" y="122" text-anchor="middle" dominant-baseline="central" class="sm" fill="#534AB7">chunk-size: N</text>

  <line x1="132" y1="110" x2="152" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ItemReader -->
  <rect x="152" y="88" width="118" height="44" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="211" y="106" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0C447C">ItemReader</text>
  <text x="211" y="122" text-anchor="middle" dominant-baseline="central" class="sm" fill="#185FA5">1건씩 read</text>

  <line x1="270" y1="110" x2="290" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ItemProcessor -->
  <rect x="290" y="88" width="128" height="44" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="354" y="106" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#085041">ItemProcessor</text>
  <text x="354" y="122" text-anchor="middle" dominant-baseline="central" class="sm" fill="#0F6E56">변환 / null=필터</text>

  <line x1="418" y1="110" x2="438" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Chunk buffer -->
  <rect x="438" y="88" width="120" height="44" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="498" y="106" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#412402">Chunk buffer</text>
  <text x="498" y="122" text-anchor="middle" dominant-baseline="central" class="sm" fill="#633806">N건 누적</text>

  <!-- Count check -->
  <rect x="438" y="162" width="120" height="44" rx="6" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="498" y="180" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2C2C2A">count == N?</text>
  <text x="498" y="197" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5F5E5A">chunk-size 체크</text>

  <line x1="498" y1="132" x2="498" y2="162" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- No → loop back -->
  <text x="432" y="187" text-anchor="end" dominant-baseline="central" class="sm" fill="#5F5E5A">No →</text>
  <path d="M438 184 L420 184 L420 68 L211 68 L211 88" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)" opacity="0.55"/>

  <!-- ItemWriter -->
  <rect x="590" y="162" width="84" height="44" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <text x="632" y="180" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#4A1B0C">ItemWriter</text>
  <text x="632" y="197" text-anchor="middle" dominant-baseline="central" class="sm" fill="#993C1D">N건 일괄 write</text>

  <line x1="558" y1="184" x2="590" y2="184" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="573" y="175" text-anchor="middle" class="sm" fill="#5F5E5A">Yes</text>

  <!-- commit -->
  <rect x="560" y="240" width="114" height="38" rx="6" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
  <text x="617" y="255" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#173404">commit()</text>
  <text x="617" y="270" text-anchor="middle" dominant-baseline="central" class="sm" fill="#3B6D11">트랜잭션 커밋</text>

  <line x1="632" y1="206" x2="632" y2="240" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Skip / Retry zone -->
  <rect x="152" y="308" width="360" height="62" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="1"/>
  <text x="332" y="330" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#501313">Skip / Retry 정책</text>
  <text x="332" y="352" text-anchor="middle" dominant-baseline="central" class="sub" fill="#A32D2D">skipLimit, retryLimit 설정 — 허용 초과 시 Step FAILED</text>

  <!-- read fail arrow -->
  <path d="M211 132 L211 308" fill="none" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrr)" opacity="0.5"/>
  <text x="220" y="204" dominant-baseline="central" class="sm" fill="#A32D2D">read exception</text>

  <!-- write fail arrow -->
  <path d="M632 278 L632 360 L332 360 L332 370" fill="none" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrr)" opacity="0.5"/>
</svg>
