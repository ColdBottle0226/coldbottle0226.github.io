<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Transaction boundary dashed box -->
  <rect x="22" y="52" width="636" height="240" rx="12" fill="none" stroke-dasharray="6 4" stroke="#B4B2A9" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#888780">트랜잭션 경계 (chunk-size마다 반복)</text>
  <text x="44" y="70" dominant-baseline="central" font-size="12" fill="#888780">▶ chunk loop</text>

  <!-- Step box -->
  <rect x="36" y="90" width="100" height="44" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="86" y="107" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Step</text>
  <text x="86" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">chunk-size: N</text>

  <line x1="136" y1="112" x2="154" y2="112" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ItemReader -->
  <rect x="154" y="90" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="214" y="107" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">ItemReader</text>
  <text x="214" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">1건씩 read</text>

  <line x1="274" y1="112" x2="292" y2="112" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ItemProcessor -->
  <rect x="292" y="90" width="128" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="356" y="107" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">ItemProcessor</text>
  <text x="356" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">변환 / null=필터</text>

  <line x1="420" y1="112" x2="438" y2="112" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Chunk buffer -->
  <rect x="438" y="90" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="498" y="107" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">Chunk buffer</text>
  <text x="498" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">N건 누적</text>

  <!-- Count check -->
  <rect x="438" y="166" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="498" y="183" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">count == N?</text>
  <text x="498" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">chunk-size 체크</text>

  <!-- Arrow buffer to check -->
  <line x1="498" y1="134" x2="498" y2="166" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- No - loop back arrow -->
  <text x="432" y="190" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">No →</text>
  <path d="M438 188 L420 188 L420 70 L214 70 L214 90" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- ItemWriter -->
  <rect x="590" y="166" width="70" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="625" y="183" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">ItemWriter</text>
  <text x="625" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">N건 일괄 write</text>

  <line x1="558" y1="188" x2="590" y2="188" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="573" y="180" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>

  <!-- commit -->
  <rect x="546" y="248" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text x="611" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">commit()</text>
  <text x="611" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">트랜잭션 커밋</text>

  <line x1="625" y1="210" x2="625" y2="248" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Skip / Retry zone -->
  <rect x="154" y="310" width="360" height="56" rx="10" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
  <text x="334" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#501313">Skip / Retry 정책</text>
  <text x="334" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">skipLimit, retryLimit 설정 — 허용 범위 초과 시 Step FAILED</text>

  <!-- read fail arrow -->
  <path d="M214 134 L214 310" fill="none" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" opacity="0.5"/>
  <text x="222" y="200" dominant-baseline="central" font-size="10" fill="#A32D2D">read exception</text>

  <!-- write fail arrow -->
  <path d="M625 292 L625 360 L334 360 L334 366" fill="none" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" opacity="0.5"/>
  <text x="540" y="334" dominant-baseline="central" font-size="10" fill="#A32D2D">write exception</text>
</svg>
