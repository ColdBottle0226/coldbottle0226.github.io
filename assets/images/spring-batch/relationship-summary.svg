<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; }
      .sm  { font-size: 10px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="300" rx="12" fill="#fafafa"/>

  <!-- Job -->
  <rect x="30" y="40" width="96" height="44" rx="6" fill="#F0EFFD" stroke="#AFA9EC" stroke-width="1"/>
  <text x="78" y="58" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#3C3489">Job</text>
  <text x="78" y="74" text-anchor="middle" dominant-baseline="central" class="sm" fill="#534AB7">설계도</text>

  <text x="148" y="53" dominant-baseline="central" class="sm" fill="#888">1</text>
  <line x1="126" y1="62" x2="186" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="148" y="74" dominant-baseline="central" class="sm" fill="#888">N</text>

  <!-- JobInstance -->
  <rect x="186" y="40" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="246" y="58" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#0C447C">JobInstance</text>
  <text x="246" y="74" text-anchor="middle" dominant-baseline="central" class="sm" fill="#185FA5">논리적 실행 단위</text>

  <!-- JobParameters dashed above -->
  <rect x="188" y="6" width="116" height="24" rx="5" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="246" y="18" text-anchor="middle" dominant-baseline="central" class="sm" fill="#0C447C" font-weight="700">JobParameters</text>
  <line x1="246" y1="30" x2="246" y2="40" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="330" y="53" dominant-baseline="central" class="sm" fill="#888">1</text>
  <line x1="306" y1="62" x2="366" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="330" y="74" dominant-baseline="central" class="sm" fill="#888">N</text>

  <!-- JobExecution -->
  <rect x="366" y="40" width="120" height="44" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="426" y="58" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#085041">JobExecution</text>
  <text x="426" y="74" text-anchor="middle" dominant-baseline="central" class="sm" fill="#0F6E56">실행 시도</text>

  <text x="510" y="53" dominant-baseline="central" class="sm" fill="#888">1</text>
  <line x1="486" y1="62" x2="546" y2="62" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="510" y="74" dominant-baseline="central" class="sm" fill="#888">N</text>

  <!-- StepExecution -->
  <rect x="546" y="40" width="116" height="44" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <text x="604" y="58" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#4A1B0C">StepExecution</text>
  <text x="604" y="74" text-anchor="middle" dominant-baseline="central" class="sm" fill="#993C1D">Step 실행 시도</text>

  <!-- ExecutionContext from StepExecution -->
  <rect x="548" y="112" width="112" height="42" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="604" y="129" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#412402">ExecutionContext</text>
  <text x="604" y="146" text-anchor="middle" dominant-baseline="central" class="sm" fill="#633806">재시작 상태</text>
  <line x1="604" y1="84" x2="604" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ExecutionContext from JobExecution -->
  <rect x="368" y="112" width="112" height="42" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="424" y="129" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#412402">ExecutionContext</text>
  <text x="424" y="146" text-anchor="middle" dominant-baseline="central" class="sm" fill="#633806">Job 레벨 상태</text>
  <line x1="426" y1="84" x2="426" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step box -->
  <rect x="30" y="150" width="310" height="120" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="50" y="172" dominant-baseline="central" class="lbl" fill="#085041">Step</text>
  <text x="50" y="190" dominant-baseline="central" class="sub" fill="#0F6E56">독립적 배치 단계</text>

  <rect x="46" y="198" width="128" height="56" rx="6" fill="#085041" opacity="0.8"/>
  <text x="110" y="218" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#9FE1CB">Chunk-oriented</text>
  <text x="110" y="234" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5DCAA5">Reader→Processor→Writer</text>
  <text x="110" y="246" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5DCAA5">N건 단위 트랜잭션</text>

  <rect x="188" y="198" width="138" height="56" rx="6" fill="#04342C" opacity="0.85"/>
  <text x="257" y="218" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#9FE1CB">Tasklet</text>
  <text x="257" y="234" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5DCAA5">단일 실행 로직</text>
  <text x="257" y="246" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5DCAA5">RepeatStatus 반환</text>

  <!-- Arrow Job contains Step -->
  <path d="M78 84 L78 150" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)" opacity="0.4"/>
  <text x="84" y="120" dominant-baseline="central" class="sm" fill="#888">포함</text>

  <!-- JobRepository -->
  <rect x="358" y="186" width="310" height="56" rx="8" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="513" y="209" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2C2C2A">JobRepository</text>
  <text x="513" y="228" text-anchor="middle" dominant-baseline="central" class="sub" fill="#5F5E5A">모든 메타데이터 CRUD — 영속화</text>

  <!-- JobOperator label -->
  <rect x="30" y="272" width="200" height="22" rx="5" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="130" y="283" text-anchor="middle" dominant-baseline="central" class="sm" fill="#2C2C2A">JobOperator: 시작 / 중단 / 재시작</text>
</svg>
