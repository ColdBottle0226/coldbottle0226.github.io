<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Job -->
  <rect x="40" y="40" width="100" height="44" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="90" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Job</text>
  <text x="90" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">설계도</text>

  <!-- 1:N label -->
  <text x="174" y="52" dominant-baseline="central" font-size="12" fill="#888780">1</text>
  <line x1="140" y1="62" x2="200" y2="62" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="174" y="74" dominant-baseline="central" font-size="12" fill="#888780">N</text>

  <!-- JobInstance -->
  <rect x="200" y="40" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="260" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">JobInstance</text>
  <text x="260" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">논리적 실행 단위</text>

  <!-- JobParameters (top) -->
  <rect x="200" y="6" width="120" height="28" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="260" y="20" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">JobParameters</text>
  <line x1="260" y1="34" x2="260" y2="40" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- 1:N label -->
  <text x="344" y="52" dominant-baseline="central" font-size="12" fill="#888780">1</text>
  <line x1="320" y1="62" x2="380" y2="62" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="344" y="74" dominant-baseline="central" font-size="12" fill="#888780">N</text>

  <!-- JobExecution -->
  <rect x="380" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="440" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">JobExecution</text>
  <text x="440" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">실행 시도</text>

  <!-- 1:N label -->
  <text x="524" y="52" dominant-baseline="central" font-size="12" fill="#888780">1</text>
  <line x1="500" y1="62" x2="560" y2="62" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="524" y="74" dominant-baseline="central" font-size="12" fill="#888780">N</text>

  <!-- StepExecution -->
  <rect x="560" y="40" width="100" height="44" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="610" y="57" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">StepExecution</text>
  <text x="610" y="74" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Step 실행 시도</text>

  <!-- ExecutionContext (from StepExecution) -->
  <rect x="560" y="114" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="610" y="131" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">ExecutionContext</text>
  <text x="610" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">재시작 상태 저장</text>
  <line x1="610" y1="84" x2="610" y2="114" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ExecutionContext (from JobExecution) -->
  <rect x="380" y="114" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="430" y="131" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">ExecutionContext</text>
  <text x="430" y="148" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">Job 레벨 상태</text>
  <line x1="440" y1="84" x2="440" y2="114" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step box with two sub-types -->
  <rect x="40" y="150" width="300" height="120" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="60" y="172" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Step</text>
  <text x="60" y="190" dominant-baseline="central" font-size="12" fill="#0F6E56">독립적 배치 단계</text>

  <!-- Chunk sub -->
  <rect x="56" y="198" width="130" height="56" rx="8" fill="#085041" opacity="0.75"/>
  <text x="121" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#9FE1CB">Chunk-oriented</text>
  <text x="121" y="234" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5DCAA5">Reader→Processor→Writer</text>
  <text x="121" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5DCAA5">N건 단위 트랜잭션</text>

  <!-- Tasklet sub -->
  <rect x="198" y="198" width="126" height="56" rx="8" fill="#04342C" opacity="0.85"/>
  <text x="261" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#9FE1CB">Tasklet</text>
  <text x="261" y="234" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5DCAA5">단일 실행 로직</text>
  <text x="261" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5DCAA5">RepeatStatus 반환</text>

  <!-- JobRepository -->
  <rect x="360" y="196" width="300" height="56" rx="10" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="510" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">JobRepository</text>
  <text x="510" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">모든 메타데이터 CRUD — 영속화</text>

  <!-- Arrow Job to Step (containment) -->
  <path d="M90 84 L90 150" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)" opacity="0.4"/>
  <text x="96" y="120" dominant-baseline="central" font-size="10" fill="#888780">포함</text>

  <!-- JobOperator label box -->
  <rect x="40" y="268" width="200" height="22" rx="6" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="140" y="279" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">JobOperator: 시작 / 중단 / 재시작</text>
</svg>
