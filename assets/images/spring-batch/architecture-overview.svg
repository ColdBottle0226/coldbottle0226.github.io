<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; }
      .sm  { font-size: 10px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="520" rx="12" fill="#fafafa"/>

  <!-- JobRepository bar -->
  <rect x="20" y="468" width="660" height="40" rx="8" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="350" y="484" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2C2C2A">JobRepository</text>
  <text x="350" y="499" text-anchor="middle" dominant-baseline="central" class="sm" fill="#5F5E5A">BATCH_JOB_INSTANCE · BATCH_JOB_EXECUTION · BATCH_STEP_EXECUTION</text>

  <!-- Job outer container -->
  <rect x="20" y="18" width="660" height="200" rx="12" fill="#F0EFFD" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="40" y="42" dominant-baseline="central" class="lbl" fill="#3C3489">Job</text>
  <text x="40" y="60" dominant-baseline="central" class="sub" fill="#534AB7">전체 배치 프로세스를 감싸는 최상위 컨테이너</text>

  <!-- Step 1 Chunk -->
  <rect x="40" y="74" width="178" height="118" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="129" y="97" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#085041">Step 1</text>
  <text x="129" y="114" text-anchor="middle" dominant-baseline="central" class="sub" fill="#0F6E56">Chunk-oriented</text>
  <rect x="52" y="126" width="44" height="22" rx="4" fill="#085041"/>
  <text x="74" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Reader</text>
  <rect x="101" y="126" width="46" height="22" rx="4" fill="#085041"/>
  <text x="124" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Processor</text>
  <rect x="153" y="126" width="46" height="22" rx="4" fill="#085041"/>
  <text x="176" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Writer</text>
  <text x="129" y="172" text-anchor="middle" dominant-baseline="central" class="sm" fill="#0F6E56">N건 단위 처리</text>

  <line x1="218" y1="133" x2="236" y2="133" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 2 Chunk -->
  <rect x="236" y="74" width="178" height="118" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="325" y="97" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#085041">Step 2</text>
  <text x="325" y="114" text-anchor="middle" dominant-baseline="central" class="sub" fill="#0F6E56">Chunk-oriented</text>
  <rect x="248" y="126" width="44" height="22" rx="4" fill="#085041"/>
  <text x="270" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Reader</text>
  <rect x="297" y="126" width="46" height="22" rx="4" fill="#085041"/>
  <text x="320" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Processor</text>
  <rect x="349" y="126" width="46" height="22" rx="4" fill="#085041"/>
  <text x="372" y="137" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">Writer</text>
  <text x="325" y="172" text-anchor="middle" dominant-baseline="central" class="sm" fill="#0F6E56">N건 단위 처리</text>

  <line x1="414" y1="133" x2="432" y2="133" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 3 Tasklet -->
  <rect x="432" y="74" width="224" height="118" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <text x="544" y="97" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#4A1B0C">Step 3</text>
  <text x="544" y="114" text-anchor="middle" dominant-baseline="central" class="sub" fill="#993C1D">TaskletStep</text>
  <rect x="472" y="128" width="144" height="34" rx="6" fill="#993C1D" opacity="0.8"/>
  <text x="544" y="147" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#F5C4B3">Tasklet</text>
  <text x="544" y="172" text-anchor="middle" dominant-baseline="central" class="sm" fill="#993C1D">단일 로직 (RepeatStatus)</text>

  <!-- Execution layer -->
  <rect x="20" y="238" width="320" height="214" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="40" y="260" dominant-baseline="central" class="lbl" fill="#0C447C">실행 추적 (Execution layer)</text>

  <rect x="36" y="276" width="130" height="50" rx="6" fill="#185FA5"/>
  <text x="101" y="297" text-anchor="middle" dominant-baseline="central" class="lbl" fill="white">JobInstance</text>
  <text x="101" y="314" text-anchor="middle" dominant-baseline="central" class="sm" fill="#B5D4F4">Job + 식별 파라미터</text>

  <rect x="184" y="276" width="140" height="50" rx="6" fill="#185FA5"/>
  <text x="254" y="297" text-anchor="middle" dominant-baseline="central" class="lbl" fill="white">JobParameters</text>
  <text x="254" y="314" text-anchor="middle" dominant-baseline="central" class="sm" fill="#B5D4F4">인스턴스 식별 키</text>

  <rect x="36" y="342" width="130" height="50" rx="6" fill="#185FA5"/>
  <text x="101" y="363" text-anchor="middle" dominant-baseline="central" class="lbl" fill="white">JobExecution</text>
  <text x="101" y="380" text-anchor="middle" dominant-baseline="central" class="sm" fill="#B5D4F4">단일 실행 시도</text>

  <rect x="184" y="342" width="140" height="50" rx="6" fill="#185FA5"/>
  <text x="254" y="363" text-anchor="middle" dominant-baseline="central" class="lbl" fill="white">StepExecution</text>
  <text x="254" y="380" text-anchor="middle" dominant-baseline="central" class="sm" fill="#B5D4F4">Step 단일 실행 시도</text>

  <rect x="36" y="408" width="290" height="30" rx="6" fill="#EF9F27"/>
  <text x="181" y="423" text-anchor="middle" dominant-baseline="central" class="lbl" fill="white">ExecutionContext — 재시작 상태 저장</text>

  <!-- JobOperator -->
  <rect x="358" y="238" width="322" height="60" rx="8" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="519" y="264" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#2C2C2A">JobOperator</text>
  <text x="519" y="282" text-anchor="middle" dominant-baseline="central" class="sub" fill="#5F5E5A">start / stop / restart / abandon</text>

  <!-- Chunk detail -->
  <rect x="358" y="316" width="322" height="136" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
  <text x="519" y="338" text-anchor="middle" dominant-baseline="central" class="lbl" fill="#173404">Chunk-oriented Processing</text>
  <text x="519" y="356" text-anchor="middle" dominant-baseline="central" class="sub" fill="#3B6D11">Read 1건 → Process 1건 → chunk 누적</text>
  <text x="519" y="374" text-anchor="middle" dominant-baseline="central" class="sub" fill="#3B6D11">chunk-size 도달 → Write 일괄 → commit</text>
  <rect x="376" y="388" width="64" height="26" rx="4" fill="#085041"/>
  <text x="408" y="401" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">ItemReader</text>
  <line x1="440" y1="401" x2="452" y2="401" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrg)"/>
  <rect x="452" y="388" width="70" height="26" rx="4" fill="#085041"/>
  <text x="487" y="401" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">ItemProcessor</text>
  <line x1="522" y1="401" x2="534" y2="401" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrg)"/>
  <rect x="534" y="388" width="64" height="26" rx="4" fill="#085041"/>
  <text x="566" y="401" text-anchor="middle" dominant-baseline="central" class="sm" fill="#9FE1CB">ItemWriter</text>
  <text x="519" y="434" text-anchor="middle" dominant-baseline="central" class="sm" fill="#3B6D11">트랜잭션은 Write(commit) 단위</text>

  <!-- Arrow: JobOperator → Job -->
  <path d="M519 238 L519 220 L350 220 L350 148" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)" opacity="0.5"/>
</svg>
