<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- JobRepository (bottom bar) -->
  <rect x="20" y="480" width="640" height="44" rx="10" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="497" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">JobRepository</text>
  <text x="340" y="514" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">모든 메타데이터 영속화 — BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION, BATCH_STEP_EXECUTION …</text>

  <!-- Job outer container -->
  <rect x="20" y="20" width="640" height="200" rx="14" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="44" y="46" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Job</text>
  <text x="44" y="62" dominant-baseline="central" font-size="12" fill="#534AB7">전체 배치 프로세스를 감싸는 최상위 컨테이너</text>

  <!-- Step 1 (Chunk) -->
  <rect x="40" y="80" width="175" height="120" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="127" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Step 1</text>
  <text x="127" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Chunk-oriented</text>
  <rect x="52" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="75" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Reader</text>
  <rect x="104" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="127" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Processor</text>
  <rect x="156" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="179" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Writer</text>
  <text x="127" y="178" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">chunk-size N개 단위 처리</text>

  <!-- Step 2 (Chunk) -->
  <rect x="232" y="80" width="175" height="120" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="319" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Step 2</text>
  <text x="319" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Chunk-oriented</text>
  <rect x="244" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="267" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Reader</text>
  <rect x="296" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="319" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Processor</text>
  <rect x="348" y="134" width="46" height="26" rx="5" fill="#085041" opacity="0.7"/>
  <text x="371" y="147" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9FE1CB">Writer</text>
  <text x="319" y="178" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">chunk-size N개 단위 처리</text>

  <!-- Step 3 (Tasklet) -->
  <rect x="424" y="80" width="218" height="120" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="533" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Step 3</text>
  <text x="533" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">TaskletStep</text>
  <rect x="464" y="138" width="138" height="38" rx="8" fill="#993C1D" opacity="0.6"/>
  <text x="533" y="157" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#F5C4B3">Tasklet</text>
  <text x="533" y="178" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">단일 로직 실행 (RepeatStatus)</text>

  <!-- Arrows between steps -->
  <line x1="215" y1="140" x2="232" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="407" y1="140" x2="424" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Execution layer -->
  <rect x="20" y="244" width="305" height="210" rx="14" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="44" y="268" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">실행 추적 (Execution layer)</text>

  <!-- JobInstance -->
  <rect x="36" y="284" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="101" y="306" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">JobInstance</text>
  <text x="101" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Job + 식별 파라미터</text>

  <!-- JobParameters -->
  <rect x="182" y="284" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="247" y="306" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">JobParameters</text>
  <text x="247" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">인스턴스 식별 키</text>

  <!-- JobExecution -->
  <rect x="36" y="360" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="101" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">JobExecution</text>
  <text x="101" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">단일 실행 시도</text>

  <!-- StepExecution -->
  <rect x="182" y="360" width="130" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="247" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#E6F1FB">StepExecution</text>
  <text x="247" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B5D4F4">Step 단일 실행 시도</text>

  <!-- ExecutionContext -->
  <rect x="36" y="436" width="276" height="38" rx="8" fill="#FAC775" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="174" y="450" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">ExecutionContext</text>
  <text x="174" y="465" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#633806">재시작을 위한 key-value 영속 상태</text>

  <!-- JobOperator -->
  <rect x="343" y="244" width="317" height="66" rx="10" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="501" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">JobOperator</text>
  <text x="501" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">start / stop / restart / abandon</text>

  <!-- Chunk Detail -->
  <rect x="343" y="328" width="317" height="126" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
  <text x="501" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">Chunk-oriented processing</text>
  <text x="501" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">Read 1건 → Process 1건 → chunk 누적</text>
  <text x="501" y="386" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">chunk-size 도달 → Write 일괄 → commit</text>
  <rect x="362" y="400" width="66" height="30" rx="6" fill="#085041" opacity="0.7"/>
  <text x="395" y="415" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">ItemReader</text>
  <line x1="428" y1="415" x2="440" y2="415" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="400" width="72" height="30" rx="6" fill="#085041" opacity="0.7"/>
  <text x="476" y="415" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">ItemProcessor</text>
  <line x1="512" y1="415" x2="524" y2="415" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="524" y="400" width="66" height="30" rx="6" fill="#085041" opacity="0.7"/>
  <text x="557" y="415" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#9FE1CB">ItemWriter</text>
  <text x="501" y="444" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">트랜잭션은 Write(commit) 단위로 관리</text>

  <!-- Arrow JobOperator to Job -->
  <path d="M501 244 L501 228 L340 228 L340 155" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Arrow ExecutionContext to JobRepository -->
  <line x1="174" y1="474" x2="174" y2="480" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
</svg>
