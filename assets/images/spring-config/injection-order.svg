<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="820" fill="#FAFAF8"/>

  <!-- SpringApplication.run() -->
  <rect x="200" y="20" width="280" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="47" text-anchor="middle">SpringApplication.run()</text>
  <line x1="340" y1="64" x2="340" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 1 -->
  <text font-size="11" fill="#888780" x="48" y="102">Phase 1</text>
  <rect x="60" y="90" width="560" height="110" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="112" text-anchor="middle">Environment 구성 (애플리케이션 시작 전)</text>

  <rect x="80" y="122" width="155" height="68" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="157" y="144" text-anchor="middle">PropertySource 로드</text>
  <text font-size="12" fill="#444441" x="157" y="162" text-anchor="middle">yml / properties</text>
  <text font-size="12" fill="#444441" x="157" y="177" text-anchor="middle">환경변수 / 커맨드라인 통합</text>

  <rect x="255" y="122" width="155" height="68" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="332" y="144" text-anchor="middle">프로파일 결정</text>
  <text font-size="12" fill="#444441" x="332" y="162" text-anchor="middle">spring.profiles.active</text>
  <text font-size="12" fill="#444441" x="332" y="177" text-anchor="middle">환경 확정</text>

  <rect x="430" y="122" width="170" height="68" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="515" y="141" text-anchor="middle">ApplicationEnvironment</text>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="515" y="158" text-anchor="middle">PreparedEvent</text>
  <text font-size="12" fill="#444441" x="515" y="177" text-anchor="middle">리스너가 환경 수정 가능</text>

  <line x1="340" y1="200" x2="340" y2="230" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 2 -->
  <text font-size="11" fill="#888780" x="48" y="242">Phase 2</text>
  <rect x="60" y="230" width="560" height="100" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="252" text-anchor="middle">ApplicationContext 생성 및 빈 정의 등록</text>

  <rect x="80" y="268" width="240" height="52" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="200" y="288" text-anchor="middle">컴포넌트 스캔</text>
  <text font-size="12" fill="#444441" x="200" y="308" text-anchor="middle">@Component, @Configuration, @Bean 등록</text>

  <rect x="340" y="268" width="260" height="52" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="470" y="288" text-anchor="middle">@PropertySource 처리</text>
  <text font-size="12" fill="#444441" x="470" y="308" text-anchor="middle">커스텀 파일 → Environment 추가</text>

  <line x1="340" y1="330" x2="340" y2="360" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 3 -->
  <text font-size="11" fill="#888780" x="48" y="372">Phase 3</text>
  <rect x="60" y="360" width="560" height="110" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="382" text-anchor="middle">BeanPostProcessor 등록 (설정 처리 인프라)</text>

  <rect x="80" y="396" width="240" height="64" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="200" y="416" text-anchor="middle">ConfigurationClassPostProcessor</text>
  <text font-size="12" fill="#444441" x="200" y="434" text-anchor="middle">@Configuration 파싱</text>
  <text font-size="12" fill="#444441" x="200" y="450" text-anchor="middle">@Bean → BeanDefinition 변환</text>

  <rect x="340" y="396" width="260" height="64" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="470" y="416" text-anchor="middle">ConfigurationPropertiesBinder</text>
  <text font-size="12" fill="#444441" x="470" y="434" text-anchor="middle">@ConfigurationProperties 클래스를</text>
  <text font-size="12" fill="#444441" x="470" y="450" text-anchor="middle">Environment에 바인딩할 준비</text>

  <line x1="340" y1="470" x2="340" y2="500" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 4 핵심 -->
  <text font-size="11" fill="#888780" x="48" y="512">Phase 4 — 핵심: 값이 실제로 주입되는 시점</text>
  <rect x="60" y="500" width="560" height="190" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="522" text-anchor="middle">싱글톤 빈 인스턴스 생성 + 설정 값 주입</text>

  <rect x="80" y="536" width="220" height="52" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="190" y="556" text-anchor="middle">① 빈 인스턴스 생성</text>
  <text font-size="12" fill="#444441" x="190" y="574" text-anchor="middle">생성자 호출 (Constructor Injection)</text>

  <rect x="320" y="536" width="280" height="52" rx="6" fill="#FAFAF8" stroke="#993C1D" stroke-width="1"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="460" y="553" text-anchor="middle">② Setter / Field 주입</text>
  <text font-size="12" fill="#444441" x="460" y="567" text-anchor="middle">@Value, @ConfigurationProperties</text>
  <text font-size="12" fill="#993C1D" x="460" y="583" text-anchor="middle">← yml 값이 실제로 들어오는 시점</text>

  <rect x="80" y="600" width="220" height="52" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="190" y="620" text-anchor="middle">③ @PostConstruct</text>
  <text font-size="12" fill="#444441" x="190" y="638" text-anchor="middle">초기화 로직 (값이 모두 주입된 후)</text>

  <rect x="320" y="600" width="280" height="52" rx="6" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="460" y="620" text-anchor="middle">④ BeanPostProcessor (after)</text>
  <text font-size="12" fill="#444441" x="460" y="638" text-anchor="middle">AOP 프록시 적용 등 후처리</text>

  <line x1="340" y1="690" x2="340" y2="720" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 5 -->
  <text font-size="11" fill="#888780" x="48" y="732">Phase 5</text>
  <rect x="60" y="720" width="560" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-size="13" font-weight="600" fill="#2C2C2A" x="340" y="737" text-anchor="middle">ContextRefreshedEvent → ApplicationReadyEvent</text>
  <text font-size="12" fill="#444441" x="340" y="754" text-anchor="middle">CommandLineRunner / ApplicationRunner 실행 → 요청 수신 시작</text>

  <!-- 우측 타임라인 힌트 -->
  <text font-size="10" fill="#888780" x="635" y="150" text-anchor="middle">우선순위</text>
  <text font-size="10" fill="#888780" x="635" y="162" text-anchor="middle">결정 시점</text>
  <text font-size="10" fill="#888780" x="635" y="295" text-anchor="middle">빈 정의</text>
  <text font-size="10" fill="#888780" x="635" y="307" text-anchor="middle">등록 시점</text>
  <text font-size="10" fill="#888780" x="635" y="430" text-anchor="middle">인프라</text>
  <text font-size="10" fill="#888780" x="635" y="442" text-anchor="middle">준비 시점</text>
  <text font-size="10" fill="#888780" x="635" y="590" text-anchor="middle">값 주입</text>
  <text font-size="10" fill="#888780" x="635" y="602" text-anchor="middle">실행 시점</text>
</svg>
