<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="840" height="450">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/></filter>
  </defs>

  <rect width="840" height="450" rx="16" fill="#f8f9fc"/>
  <text x="420" y="36" font-size="20" font-weight="700" fill="#1a2030" text-anchor="middle">CIDR 비트마스크 연산 원리</text>

  <!-- CIDR 설명 박스 -->
  <rect x="24" y="52" width="792" height="52" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#sh)"/>
  <text x="44" y="72" font-size="15" font-weight="700" fill="#1a2030">CIDR 표기:</text>
  <text x="140" y="72" font-size="15" font-weight="700" fill="#8b5cf6" font-family="'Courier New',monospace">10.0.0.0 / 8</text>
  <text x="44" y="93" font-size="11" fill="#6b7280">네트워크 주소 ↑                  ↑ 앞 8비트 고정 (네트워크) → 뒤 24비트 가변 (호스트 범위: 10.0.0.0 ~ 10.255.255.255)</text>

  <!-- 행 레이블 -->
  <text x="24" y="133" font-size="12" font-weight="700" fill="#8b5cf6">10.0.0.0  (범위 주소)</text>
  <text x="24" y="217" font-size="12" font-weight="700" fill="#f97316">/8 서브넷 마스크</text>
  <text x="24" y="301" font-size="12" font-weight="700" fill="#3b82f6">클라이언트 IP  10.0.0.5</text>

  <!-- 옥텟 셀 생성 함수 (4개 × 3행) -->
  <!-- Row 1: 10.0.0.0 -->
  <!-- Octet 1: 10 -->
  <rect x="24" y="140" width="190" height="66" rx="8" fill="#f3f0ff" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/>
  <text x="119" y="163" font-size="20" font-weight="700" fill="#8b5cf6" text-anchor="middle">10</text>
  <text x="30" y="196" font-size="10" fill="#8b5cf6" font-family="'Courier New',monospace">0 0 0 0  1 0 1 0</text>

  <!-- Octet 2: 0 -->
  <rect x="222" y="140" width="190" height="66" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1" filter="url(#sh)"/>
  <text x="317" y="163" font-size="20" font-weight="700" fill="#8b5cf6" text-anchor="middle">0</text>
  <text x="228" y="196" font-size="10" fill="#c4b5fd" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 3: 0 -->
  <rect x="420" y="140" width="190" height="66" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="163" font-size="20" font-weight="700" fill="#8b5cf6" text-anchor="middle">0</text>
  <text x="426" y="196" font-size="10" fill="#c4b5fd" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 4: 0 -->
  <rect x="618" y="140" width="198" height="66" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1" filter="url(#sh)"/>
  <text x="717" y="163" font-size="20" font-weight="700" fill="#8b5cf6" text-anchor="middle">0</text>
  <text x="624" y="196" font-size="10" fill="#c4b5fd" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Row 2: /8 마스크 -->
  <!-- Octet 1: 255 -->
  <rect x="24" y="224" width="190" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
  <text x="119" y="247" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle">255</text>
  <text x="30" y="280" font-size="10" fill="#f97316" font-family="'Courier New',monospace">1 1 1 1  1 1 1 1</text>

  <!-- Octet 2: 0 -->
  <rect x="222" y="224" width="190" height="66" rx="8" fill="#fff" stroke="#f97316" stroke-width="1" filter="url(#sh)"/>
  <text x="317" y="247" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle">0</text>
  <text x="228" y="280" font-size="10" fill="#d1d5db" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 3: 0 -->
  <rect x="420" y="224" width="190" height="66" rx="8" fill="#fff" stroke="#f97316" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="247" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle">0</text>
  <text x="426" y="280" font-size="10" fill="#d1d5db" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 4: 0 -->
  <rect x="618" y="224" width="198" height="66" rx="8" fill="#fff" stroke="#f97316" stroke-width="1" filter="url(#sh)"/>
  <text x="717" y="247" font-size="20" font-weight="700" fill="#f97316" text-anchor="middle">0</text>
  <text x="624" y="280" font-size="10" fill="#d1d5db" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Row 3: 10.0.0.5 -->
  <!-- Octet 1: 10 -->
  <rect x="24" y="308" width="190" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="119" y="331" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">10</text>
  <text x="30" y="364" font-size="10" fill="#3b82f6" font-family="'Courier New',monospace">0 0 0 0  1 0 1 0</text>

  <!-- Octet 2: 0 -->
  <rect x="222" y="308" width="190" height="66" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1" filter="url(#sh)"/>
  <text x="317" y="331" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">0</text>
  <text x="228" y="364" font-size="10" fill="#93c5fd" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 3: 0 -->
  <rect x="420" y="308" width="190" height="66" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="331" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">0</text>
  <text x="426" y="364" font-size="10" fill="#93c5fd" font-family="'Courier New',monospace">0 0 0 0  0 0 0 0</text>

  <!-- Octet 4: 5 -->
  <rect x="618" y="308" width="198" height="66" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1" filter="url(#sh)"/>
  <text x="717" y="331" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">5</text>
  <text x="624" y="364" font-size="10" fill="#3b82f6" font-family="'Courier New',monospace">0 0 0 0  0 1 0 1</text>

  <!-- 결과 박스 -->
  <rect x="24" y="390" width="792" height="46" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="44" y="409" font-size="12" font-weight="700" fill="#22c55e">결과:</text>
  <text x="90" y="409" font-size="11" fill="#1a2030" font-family="'Courier New',monospace">(10.0.0.5 &amp; /8 마스크)  ==  (10.0.0.0 &amp; /8 마스크)</text>
  <text x="500" y="409" font-size="12" fill="#6b7280">→</text>
  <text x="520" y="409" font-size="11" fill="#1a2030" font-family="'Courier New',monospace">10.0.0.0  ==  10.0.0.0</text>
  <text x="750" y="409" font-size="14" font-weight="700" fill="#22c55e">✓ 허용</text>
  <text x="44" y="427" font-size="10" fill="#6b7280" font-family="'Courier New',monospace">~((1 &lt;&lt; (32 - 8)) - 1)  =  0xFF000000  →  첫 번째 옥텟만 비교</text>
</svg>
