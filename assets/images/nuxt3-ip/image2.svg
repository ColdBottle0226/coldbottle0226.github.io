<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #1a2030; }
      .step-title { font-size: 15px; font-weight: 700; }
      .step-path  { font-size: 12px; font-family: 'Courier New', monospace; fill: #6b7280; }
      .step-desc  { font-size: 11px; }
      .badge { font-size: 13px; font-weight: 700; fill: #fff; }
    </style>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/></filter>
  </defs>

  <rect width="720" height="530" rx="16" fill="#f8f9fc"/>
  <text x="360" y="38" class="title" text-anchor="middle">Nuxt3 실행 라이프사이클</text>

  <!-- Step 1: Server Middleware -->
  <rect x="50" y="60" width="620" height="80" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2" filter="url(#sh)"/>
  <rect x="50" y="60" width="7" height="80" rx="4" fill="#14b8a6"/>
  <circle cx="90" cy="100" r="16" fill="#14b8a6"/>
  <text x="90" y="105" class="badge" text-anchor="middle">1</text>
  <text x="118" y="90" class="step-title" fill="#14b8a6">Server Middleware</text>
  <text x="118" y="108" class="step-path">server/middleware/</text>
  <text x="118" y="126" class="step-desc" fill="#6b7280">HTTP 요청 레벨 처리 (인증, 로깅 등) — 이번 구현에서는 사용하지 않음</text>

  <!-- 화살표 -->
  <line x1="360" y1="140" x2="360" y2="168" stroke="#d1d5db" stroke-width="3"/>
  <polygon points="353,162 360,175 367,162" fill="#d1d5db"/>

  <!-- Step 2: App Plugins -->
  <rect x="50" y="178" width="620" height="80" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="50" y="178" width="7" height="80" rx="4" fill="#8b5cf6"/>
  <circle cx="90" cy="218" r="16" fill="#8b5cf6"/>
  <text x="90" y="223" class="badge" text-anchor="middle">2</text>
  <text x="118" y="208" class="step-title" fill="#8b5cf6">App Plugins</text>
  <text x="118" y="226" class="step-path">plugins/01.ip-policy.ts</text>
  <text x="118" y="246" class="step-desc" fill="#8b5cf6">▶ IP 허용 정책 API 로딩 (1회)  +  클라이언트 IP 추출 → payload 저장</text>

  <!-- 화살표 -->
  <line x1="360" y1="258" x2="360" y2="286" stroke="#d1d5db" stroke-width="3"/>
  <polygon points="353,280 360,293 367,280" fill="#d1d5db"/>

  <!-- Step 3: Route Middleware -->
  <rect x="50" y="296" width="620" height="80" rx="10" fill="#fff" stroke="#f97316" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="50" y="296" width="7" height="80" rx="4" fill="#f97316"/>
  <circle cx="90" cy="336" r="16" fill="#f97316"/>
  <text x="90" y="341" class="badge" text-anchor="middle">3</text>
  <text x="118" y="326" class="step-title" fill="#f97316">Route Middleware</text>
  <text x="118" y="344" class="step-path">middleware/ip-guard.global.ts</text>
  <text x="118" y="364" class="step-desc" fill="#f97316">▶ IP 허용 여부 체크  →  비허용 시 navigateTo('/maintenance')</text>

  <!-- 화살표 -->
  <line x1="360" y1="376" x2="360" y2="404" stroke="#d1d5db" stroke-width="3"/>
  <polygon points="353,398 360,411 367,398" fill="#d1d5db"/>

  <!-- Step 4: Page Render -->
  <rect x="50" y="414" width="620" height="80" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <rect x="50" y="414" width="7" height="80" rx="4" fill="#3b82f6"/>
  <circle cx="90" cy="454" r="16" fill="#3b82f6"/>
  <text x="90" y="459" class="badge" text-anchor="middle">4</text>
  <text x="118" y="444" class="step-title" fill="#3b82f6">Page Render</text>
  <text x="118" y="462" class="step-path">pages/</text>
  <text x="118" y="480" class="step-desc" fill="#6b7280">IP 검증 통과 시 정상 페이지 렌더링 — 비허용 IP는 여기까지 도달하지 않음</text>
</svg>
