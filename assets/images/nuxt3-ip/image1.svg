<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <defs>
    <style>
      .bg { fill: #f8f9fc; }
      .card { fill: #ffffff; stroke-width: 2; rx: 12; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #1a2030; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 14px; }
      .sub   { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #6b7280; }
      .note  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .arrow { stroke-width: 2.5; fill: none; }
      .arrowhead { stroke: none; }
    </style>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/></marker>
    <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000018"/></filter>
  </defs>

  <!-- 배경 -->
  <rect width="960" height="340" rx="16" class="bg"/>
  <!-- 상단 타이틀 -->
  <text x="480" y="38" class="title" text-anchor="middle">전체 아키텍처</text>

  <!-- 카드 1: Client -->
  <rect x="40" y="90" width="160" height="110" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="90" width="8" height="110" rx="4" fill="#3b82f6"/>
  <text x="130" y="135" class="label" fill="#3b82f6" text-anchor="middle">🌐 Client</text>
  <text x="130" y="155" class="sub" text-anchor="middle">Browser</text>
  <text x="130" y="175" class="note" fill="#3b82f6" text-anchor="middle">사용자 브라우저</text>

  <!-- 화살표 1 -->
  <line x1="200" y1="145" x2="265" y2="145" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="233" y="136" class="note" fill="#3b82f6" text-anchor="middle">HTTP Request</text>

  <!-- 카드 2: Nginx -->
  <rect x="270" y="90" width="160" height="110" rx="12" fill="#fff" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="90" width="8" height="110" rx="4" fill="#f97316"/>
  <text x="360" y="128" class="label" fill="#f97316" text-anchor="middle">🛡 Nginx</text>
  <text x="360" y="148" class="sub" text-anchor="middle">Reverse Proxy</text>
  <text x="360" y="168" class="note" fill="#f97316" text-anchor="middle">실제 IP 헤더 주입</text>
  <text x="360" y="183" class="note" fill="#f97316" text-anchor="middle">X-Real-IP 설정</text>

  <!-- 화살표 2 -->
  <line x1="430" y1="145" x2="495" y2="145" stroke="#f97316" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="463" y="136" class="note" fill="#f97316" text-anchor="middle">Proxy + IP Header</text>

  <!-- 카드 3: Nuxt3 -->
  <rect x="500" y="90" width="170" height="110" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="90" width="8" height="110" rx="4" fill="#8b5cf6"/>
  <text x="596" y="128" class="label" fill="#8b5cf6" text-anchor="middle">⚡ Nuxt3 SSR</text>
  <text x="596" y="148" class="sub" text-anchor="middle">Plugin + Middleware</text>
  <text x="596" y="168" class="note" fill="#8b5cf6" text-anchor="middle">IP 허용 여부 검증</text>
  <text x="596" y="183" class="note" fill="#8b5cf6" text-anchor="middle">2차 방어선</text>

  <!-- 화살표 3 -->
  <line x1="670" y1="145" x2="730" y2="145" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="700" y="136" class="note" fill="#8b5cf6" text-anchor="middle">GET /api/ip-policy</text>

  <!-- 카드 4: Spring Boot -->
  <rect x="735" y="90" width="180" height="110" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="735" y="90" width="8" height="110" rx="4" fill="#22c55e"/>
  <text x="830" y="128" class="label" fill="#22c55e" text-anchor="middle">🍃 Spring Boot</text>
  <text x="830" y="148" class="sub" text-anchor="middle">API Server</text>
  <text x="830" y="168" class="note" fill="#22c55e" text-anchor="middle">Redis에서 정책 조회</text>
  <text x="830" y="183" class="note" fill="#22c55e" text-anchor="middle">허용 IP 대역 반환</text>

  <!-- 하단 설명 박스 -->
  <rect x="40" y="225" width="900" height="90" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1a2030">구현 범위</text>
  <text x="60" y="268" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6b7280">• Nginx : proxy_set_header X-Real-IP $remote_addr;  /  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</text>
  <text x="60" y="286" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b5cf6">• Nuxt3 : plugins/01.ip-policy.ts (정책 로딩)  +  middleware/ip-guard.global.ts (IP 검증)</text>
  <text x="60" y="304" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#22c55e">• Spring Boot : GET /api/common/ip-policy → Redis cmcd:list 조회 → 허용 대역 반환</text>
</svg>
