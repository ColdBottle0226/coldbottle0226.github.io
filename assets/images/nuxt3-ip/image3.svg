<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <marker id="mr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ef4444"/></marker>
    <marker id="mg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="md" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9ca3af"/></marker>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000018"/></filter>
  </defs>

  <rect width="920" height="440" rx="16" fill="#f8f9fc"/>
  <text x="460" y="36" font-size="20" font-weight="700" fill="#1a2030" text-anchor="middle">리버스 프록시 환경에서의 IP 추출</text>

  <!-- ── Row 1: 직접 연결 (정상) ── -->
  <text x="30" y="70" font-size="13" font-weight="700" fill="#22c55e">① 직접 연결 — socket.remoteAddress로 실제 IP 확인 가능</text>
  <rect x="30"  y="82" width="150" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="108" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">Client</text>
  <text x="105" y="126" font-size="11" fill="#6b7280" text-anchor="middle" font-family="'Courier New',monospace">203.0.113.5</text>
  <line x1="180" y1="112" x2="368" y2="112" stroke="#22c55e" stroke-width="2" marker-end="url(#mg)"/>
  <text x="275" y="104" font-size="10" fill="#22c55e" text-anchor="middle">socket.remoteAddress</text>
  <text x="275" y="118" font-size="10" fill="#22c55e" text-anchor="middle">= 203.0.113.5 ✓</text>
  <rect x="370" y="82" width="150" height="60" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/>
  <text x="445" y="108" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">Nuxt SSR</text>
  <text x="445" y="126" font-size="11" fill="#22c55e" text-anchor="middle">203.0.113.5 ✓</text>

  <!-- ── Row 2: 프록시 경유 (문제) ── -->
  <text x="30" y="178" font-size="13" font-weight="700" fill="#ef4444">② Nginx 경유 + 헤더 없음 — Nginx IP를 클라이언트 IP로 오인!</text>
  <rect x="30"  y="190" width="150" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="216" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">Client</text>
  <text x="105" y="234" font-size="11" fill="#6b7280" text-anchor="middle" font-family="'Courier New',monospace">203.0.113.5</text>
  <line x1="180" y1="220" x2="268" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#md)"/>
  <rect x="270" y="190" width="150" height="60" rx="10" fill="#fff" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
  <text x="345" y="216" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">Nginx</text>
  <text x="345" y="234" font-size="11" fill="#6b7280" text-anchor="middle" font-family="'Courier New',monospace">10.0.0.1</text>
  <line x1="420" y1="220" x2="508" y2="220" stroke="#9ca3af" stroke-width="2" marker-end="url(#md)"/>
  <rect x="510" y="190" width="150" height="60" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2" filter="url(#sh)"/>
  <text x="585" y="210" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">Nuxt SSR</text>
  <text x="585" y="228" font-size="11" fill="#ef4444" text-anchor="middle">socket = 10.0.0.1 ✗</text>
  <text x="585" y="244" font-size="10" fill="#ef4444" text-anchor="middle">Nginx IP 오인!</text>

  <!-- ── Row 3: 프록시 경유 (해결) ── -->
  <text x="30" y="288" font-size="13" font-weight="700" fill="#22c55e">③ Nginx에서 X-Real-IP 헤더 주입 — 실제 IP 정확히 전달!</text>

  <!-- nginx.conf 코드 박스 -->
  <rect x="690" y="290" width="210" height="72" rx="8" fill="#1e1e2e" stroke="#374151" stroke-width="1"/>
  <text x="702" y="308" font-size="10" fill="#8b5cf6" font-family="'Courier New',monospace"># nginx.conf</text>
  <text x="702" y="324" font-size="10" fill="#22c55e" font-family="'Courier New',monospace">proxy_set_header</text>
  <text x="702" y="338" font-size="10" fill="#e5e7eb" font-family="'Courier New',monospace">  X-Real-IP $remote_addr;</text>
  <text x="702" y="353" font-size="10" fill="#22c55e" font-family="'Courier New',monospace">proxy_set_header</text>
  <text x="702" y="367" font-size="10" fill="#e5e7eb" font-family="'Courier New',monospace">  X-Forwarded-For ...;</text>

  <rect x="30"  y="300" width="150" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
  <text x="105" y="326" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">Client</text>
  <text x="105" y="344" font-size="11" fill="#6b7280" text-anchor="middle" font-family="'Courier New',monospace">203.0.113.5</text>
  <line x1="180" y1="330" x2="268" y2="330" stroke="#22c55e" stroke-width="2" marker-end="url(#mg)"/>
  <rect x="270" y="300" width="150" height="60" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/>
  <text x="345" y="322" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle">Nginx</text>
  <text x="345" y="338" font-size="11" fill="#22c55e" text-anchor="middle">X-Real-IP 주입</text>
  <text x="345" y="353" font-size="10" fill="#6b7280" text-anchor="middle">= 203.0.113.5</text>
  <line x1="420" y1="330" x2="508" y2="330" stroke="#22c55e" stroke-width="2" marker-end="url(#mg)"/>
  <rect x="510" y="300" width="165" height="60" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/>
  <text x="593" y="322" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle">Nuxt SSR</text>
  <text x="593" y="340" font-size="11" fill="#22c55e" text-anchor="middle">getRequestHeader(</text>
  <text x="593" y="355" font-size="10" fill="#22c55e" text-anchor="middle" font-family="'Courier New',monospace">event,'x-real-ip') ✓</text>

  <!-- 우선순위 설명 박스 -->
  <rect x="30" y="385" width="860" height="42" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="401" font-size="12" font-weight="700" fill="#1a2030">IP 추출 우선순위</text>
  <text x="50" y="418" font-size="11" fill="#6b7280">① X-Real-IP (신뢰도 최고 — Nginx가 직접 세팅)   →   ② X-Forwarded-For 첫 번째 값   →   ③ socket.remoteAddress (fallback)</text>
</svg>
