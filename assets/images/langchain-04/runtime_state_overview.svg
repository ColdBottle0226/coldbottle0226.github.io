<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Background -->
  <rect width="760" height="340" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">Runtime &amp; State — 에이전트 실행 환경 구조</text>

  <!-- Runtime Box -->
  <rect x="30" y="55" width="330" height="255" rx="10" fill="#161b27" stroke="#7c5cfc" stroke-width="1.5"/>
  <text x="195" y="80" fill="#7c5cfc" font-size="13" font-weight="700" text-anchor="middle">Runtime (실행 환경 공유 정보)</text>
  <text x="195" y="97" fill="#5a6478" font-size="10" text-anchor="middle">에이전트가 일할 때 참고하는 공유 자료</text>

  <!-- Context card -->
  <rect x="50" y="110" width="290" height="70" rx="8" fill="#1e2535" stroke="#4f9eff" stroke-width="1.2"/>
  <text x="70" y="130" fill="#4f9eff" font-size="11" font-weight="700">Context</text>
  <text x="70" y="147" fill="#8892a4" font-size="10">변하지 않는 고정 정보</text>
  <text x="70" y="162" fill="#8892a4" font-size="10">예) user_id, DB 연결 URL, is_premium</text>
  <text x="310" y="130" fill="#4f9eff" font-size="18" text-anchor="middle">🔑</text>

  <!-- Store card -->
  <rect x="50" y="192" width="290" height="70" rx="8" fill="#1e2535" stroke="#3ecf8e" stroke-width="1.2"/>
  <text x="70" y="212" fill="#3ecf8e" font-size="11" font-weight="700">Store</text>
  <text x="70" y="229" fill="#8892a4" font-size="10">장기 메모리 — 세션을 넘나드는 기억</text>
  <text x="70" y="244" fill="#8892a4" font-size="10">예) 사용자 선호, 이름, 학습 이력</text>
  <text x="310" y="212" fill="#3ecf8e" font-size="18" text-anchor="middle">🗄️</text>

  <!-- StreamWriter card -->
  <rect x="50" y="274" width="290" height="25" rx="6" fill="#1e2535" stroke="#f97316" stroke-width="1"/>
  <text x="70" y="290" fill="#f97316" font-size="10" font-weight="700">StreamWriter</text>
  <text x="160" y="290" fill="#5a6478" font-size="10"> — 실시간 이벤트 출력 (LangGraph에서 활용)</text>

  <!-- State Box -->
  <rect x="400" y="55" width="330" height="255" rx="10" fill="#161b27" stroke="#f97316" stroke-width="1.5"/>
  <text x="565" y="80" fill="#f97316" font-size="13" font-weight="700" text-anchor="middle">State (에이전트 실행 결과물)</text>
  <text x="565" y="97" fill="#5a6478" font-size="10" text-anchor="middle">에이전트가 작동하며 만들어낸 결과</text>

  <!-- Messages card -->
  <rect x="420" y="110" width="290" height="100" rx="8" fill="#1e2535" stroke="#ec4899" stroke-width="1.2"/>
  <text x="440" y="130" fill="#ec4899" font-size="11" font-weight="700">Messages</text>
  <text x="440" y="147" fill="#8892a4" font-size="10">대화 기록 리스트 (누적)</text>
  <rect x="440" y="155" width="250" height="16" rx="4" fill="#111827"/>
  <text x="450" y="167" fill="#4f9eff" font-size="9">HumanMessage  →  AIMessage  →  ToolMessage</text>
  <rect x="440" y="175" width="250" height="16" rx="4" fill="#111827"/>
  <text x="450" y="187" fill="#7c5cfc" font-size="9">AIMessage(최종)  →  구조화된 응답</text>

  <!-- ToolResults card -->
  <rect x="420" y="222" width="290" height="50" rx="8" fill="#1e2535" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="440" y="242" fill="#fbbf24" font-size="11" font-weight="700">ToolResults</text>
  <text x="440" y="258" fill="#8892a4" font-size="10">도구 실행 반환값 목록</text>

  <!-- invoke result note -->
  <rect x="420" y="282" width="290" height="17" rx="4" fill="#0f1117" stroke="#2a3348"/>
  <text x="565" y="294" fill="#5a6478" font-size="9" text-anchor="middle">agent.invoke() → {"messages": [...], "structured_response": ...}</text>

  <!-- Center arrow -->
  <line x1="362" y1="182" x2="398" y2="182" stroke="#2a3348" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2a3348"/>
    </marker>
  </defs>
  <text x="380" y="175" fill="#5a6478" font-size="9" text-anchor="middle">참조</text>

  <!-- Bottom label -->
  <text x="380" y="328" fill="#3a4459" font-size="10" text-anchor="middle">Runtime = 에이전트가 일할 때 참고하는 자료 / State = 일한 결과물</text>
</svg>
