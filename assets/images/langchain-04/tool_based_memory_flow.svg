<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="260" fill="#0f1117" rx="12"/>
  <text x="380" y="28" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Tool 기반 장기 메모리 자동화 흐름</text>

  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#4f9eff"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#3ecf8e"/>
    </marker>
    <marker id="arr4" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7c5cfc"/>
    </marker>
  </defs>

  <!-- User input -->
  <rect x="20" y="55" width="110" height="50" rx="8" fill="#1e2535" stroke="#4f9eff" stroke-width="1.2"/>
  <text x="75" y="76" fill="#4f9eff" font-size="10" font-weight="700" text-anchor="middle">사용자 입력</text>
  <text x="75" y="91" fill="#8892a4" font-size="9" text-anchor="middle">"내 이름은 J야"</text>

  <line x1="132" y1="80" x2="158" y2="80" stroke="#4f9eff" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- LLM agent -->
  <rect x="160" y="45" width="130" height="70" rx="8" fill="#1e2535" stroke="#7c5cfc" stroke-width="1.5"/>
  <text x="225" y="68" fill="#7c5cfc" font-size="10" font-weight="700" text-anchor="middle">LLM 에이전트</text>
  <text x="225" y="83" fill="#8892a4" font-size="9" text-anchor="middle">추론: "이 정보는</text>
  <text x="225" y="96" fill="#8892a4" font-size="9" text-anchor="middle">저장해야겠다"</text>

  <!-- Arrow to save tool -->
  <line x1="292" y1="80" x2="318" y2="80" stroke="#3ecf8e" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="305" y="72" fill="#3ecf8e" font-size="8" text-anchor="middle">tool_call</text>

  <!-- save_user_info tool -->
  <rect x="320" y="45" width="160" height="70" rx="8" fill="#1e2535" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="400" y="65" fill="#3ecf8e" font-size="10" font-weight="700" text-anchor="middle">save_user_info 도구</text>
  <text x="400" y="80" fill="#8892a4" font-size="9" text-anchor="middle">store.put(namespace,</text>
  <text x="400" y="93" fill="#8892a4" font-size="9" text-anchor="middle">  uuid4(), user_info)</text>

  <!-- Arrow to Store -->
  <line x1="482" y1="80" x2="508" y2="80" stroke="#3ecf8e" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Store DB -->
  <rect x="510" y="45" width="120" height="70" rx="8" fill="#1e2535" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="570" y="68" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Store (DB)</text>
  <text x="570" y="83" fill="#8892a4" font-size="9" text-anchor="middle">namespace:</text>
  <text x="570" y="96" fill="#8892a4" font-size="9" text-anchor="middle">("user_001", ...)</text>

  <!-- Arrow to Middleware -->
  <line x1="632" y1="80" x2="658" y2="80" stroke="#7c5cfc" stroke-width="1.5" marker-end="url(#arr4)"/>
  <text x="645" y="72" fill="#7c5cfc" font-size="8" text-anchor="middle">inject</text>

  <!-- Middleware -->
  <rect x="660" y="45" width="80" height="70" rx="8" fill="#1e2535" stroke="#7c5cfc" stroke-width="1.5"/>
  <text x="700" y="68" fill="#7c5cfc" font-size="9" font-weight="700" text-anchor="middle">inject_memory</text>
  <text x="700" y="82" fill="#8892a4" font-size="8" text-anchor="middle">Middleware</text>
  <text x="700" y="95" fill="#8892a4" font-size="8" text-anchor="middle">system_prompt</text>
  <text x="700" y="107" fill="#8892a4" font-size="8" text-anchor="middle">에 주입</text>

  <!-- Second flow: retrieval -->
  <text x="380" y="140" fill="#5a6478" font-size="10" text-anchor="middle">다음 세션 — 동일 user_id로 접근 시</text>

  <!-- User input 2 -->
  <rect x="20" y="155" width="110" height="50" rx="8" fill="#1e2535" stroke="#4f9eff" stroke-width="1.2"/>
  <text x="75" y="176" fill="#4f9eff" font-size="10" font-weight="700" text-anchor="middle">사용자 입력</text>
  <text x="75" y="191" fill="#8892a4" font-size="9" text-anchor="middle">"내 정보 알아?"</text>

  <line x1="132" y1="180" x2="158" y2="180" stroke="#4f9eff" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- LLM 2 -->
  <rect x="160" y="145" width="130" height="70" rx="8" fill="#1e2535" stroke="#7c5cfc" stroke-width="1.5"/>
  <text x="225" y="168" fill="#7c5cfc" font-size="10" font-weight="700" text-anchor="middle">LLM 에이전트</text>
  <text x="225" y="183" fill="#8892a4" font-size="9" text-anchor="middle">추론: "조회 도구</text>
  <text x="225" y="196" fill="#8892a4" font-size="9" text-anchor="middle">를 써야겠다"</text>

  <line x1="292" y1="180" x2="318" y2="180" stroke="#3ecf8e" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text x="305" y="172" fill="#3ecf8e" font-size="8" text-anchor="middle">tool_call</text>

  <!-- get_user_info tool -->
  <rect x="320" y="145" width="160" height="70" rx="8" fill="#1e2535" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="400" y="165" fill="#3ecf8e" font-size="10" font-weight="700" text-anchor="middle">get_user_info 도구</text>
  <text x="400" y="180" fill="#8892a4" font-size="9" text-anchor="middle">store.search(namespace)</text>
  <text x="400" y="193" fill="#8892a4" font-size="9" text-anchor="middle">→ 기억 반환</text>

  <line x1="482" y1="180" x2="508" y2="180" stroke="#3ecf8e" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Store 2 -->
  <rect x="510" y="145" width="120" height="70" rx="8" fill="#1e2535" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="570" y="168" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Store (DB)</text>
  <text x="570" y="183" fill="#3ecf8e" font-size="9" text-anchor="middle">"이름: J"</text>
  <text x="570" y="196" fill="#3ecf8e" font-size="9" text-anchor="middle">"차 선호" ...</text>

  <line x1="632" y1="180" x2="658" y2="180" stroke="#7c5cfc" stroke-width="1.5" marker-end="url(#arr4)"/>

  <!-- Final response -->
  <rect x="660" y="145" width="80" height="70" rx="8" fill="#1e2535" stroke="#7c5cfc" stroke-width="1.5"/>
  <text x="700" y="168" fill="#7c5cfc" font-size="9" font-weight="700" text-anchor="middle">최종 답변</text>
  <text x="700" y="183" fill="#8892a4" font-size="8" text-anchor="middle">"안녕하세요</text>
  <text x="700" y="195" fill="#8892a4" font-size="8" text-anchor="middle">J님! 차를</text>
  <text x="700" y="207" fill="#8892a4" font-size="8" text-anchor="middle">좋아하시죠"</text>

  <text x="380" y="244" fill="#3a4459" font-size="9" text-anchor="middle">개발자가 직접 put() 하는 게 아니라, 언어 모델이 스스로 도구를 선택해 저장·조회를 자동화</text>
</svg>
